name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run check
      - name: Install FFmpeg (smoke test)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Smoke test — server starts and /api/config returns valid JSON
        run: |
          node server.js &
          SERVER_PID=$!
          # Wait for server to be ready (up to 15s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/config > /dev/null 2>&1; then break; fi
            sleep 0.5
          done
          RESP=$(curl -sf http://localhost:3000/api/config)
          echo "Response: $RESP"
          echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('success')==True, 'success field missing'; print('Smoke test passed')"
          kill $SERVER_PID 2>/dev/null || true
